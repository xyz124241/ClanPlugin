name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Plugin bauen
        run: mvn -B -f ClanPlugin/pom.xml clean package

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ClanPlugin
          path: ClanPlugin/target/ClanPlugin.ja
